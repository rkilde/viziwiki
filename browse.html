<style>
  :root{
    --background: oklch(0.972 0.012 85);
    --foreground: oklch(0.18 0.02 60);
    --card: oklch(1 0 0);
    --secondary: oklch(0.93 0.02 80);
    --muted-foreground: oklch(0.45 0.03 60);
    --ink: oklch(0.18 0.02 60);
    --teal: oklch(0.55 0.10 200);
    --olive: oklch(0.55 0.10 130);
    --plum: oklch(0.40 0.13 340);
    --gold: oklch(0.78 0.14 75);
    --rust: oklch(0.55 0.18 35);
    --neon: oklch(0.65 0.26 5);
    --electric: oklch(0.62 0.22 260);
    --hot-pink: oklch(0.70 0.31 260);
    --acid: oklch(0.88 0.24 130);
    --cyan-pop: oklch(0.78 0.18 210);
  }
  html,body{background:var(--background); color:var(--foreground);}
  body{font-family:'Spectral',Georgia,serif;}
  /* document text (eyebrow / H1 / intro) reads the CANON type roles
     (.t-label / .t-display / .t-lead — wiki-typography.css, loaded by the
     layout); .font-mono-acc remains for the page's UI chrome (chips, sort,
     counters — widget text, not document text). */
  .font-mono-acc{font-family:'JetBrains Mono',ui-monospace,monospace; letter-spacing:.05em;}
  .halftone{background-image:radial-gradient(var(--hot-pink) 1.4px, transparent 1.6px); background-size:10px 10px;}
  .sticker{box-shadow:3px 3px 0 0 var(--ink); border:2px solid var(--ink);}
  .bg-background{background:var(--background);} .bg-card{background:var(--card);}
  .bg-secondary{background:var(--secondary);} .bg-secondary\/40{background:color-mix(in oklab,var(--secondary) 40%, transparent);}
  .bg-secondary\/60{background:color-mix(in oklab,var(--secondary) 60%, transparent);}
  .bg-background\/95{background:color-mix(in oklab,var(--background) 95%, transparent);}
  .text-foreground{color:var(--foreground);} .text-background{color:var(--background);}
  .text-muted-foreground{color:var(--muted-foreground);}
  .bg-foreground{background:var(--foreground);} .bg-foreground\/20{background:color-mix(in oklab,var(--foreground) 20%, transparent);}
  .border-foreground{border-color:var(--foreground);}
  .border-foreground\/15{border-color:color-mix(in oklab,var(--foreground) 15%, transparent);}
  .border-foreground\/20{border-color:color-mix(in oklab,var(--foreground) 20%, transparent);}
  .border-foreground\/25{border-color:color-mix(in oklab,var(--foreground) 25%, transparent);}
  .border-foreground\/30{border-color:color-mix(in oklab,var(--foreground) 30%, transparent);}
  .text-hp{color:var(--hot-pink);} .bg-hp{background:var(--hot-pink);} .border-hp{border-color:var(--hot-pink);}
  .text-neon{color:var(--neon);}
  /* (category gradients are painted inline from the directory feed — the
     merged taxonomy arrives with resolved colors; no gradient CSS here) */
  .tile{transition:transform .2s;}
  .tile:hover{transform:translateY(-4px);}
  .tile .icon{transition:transform .3s;}

<style>
  /* Keep the sticky filter row parked below the global main-bar.
     Fallback to 0 so it still sticks where --main-h is undefined
     (e.g. the standalone artifact preview, with no layout chrome). */
  .sticky.top-0 { top: var(--main-h, 0px); }

  /* Filter pills render as three explicit rows (.filter-row). On desktop the
     rows dissolve (display:contents) so pills wrap normally; on mobile they
     become three real rows packed left-to-right that scroll horizontally. */
  .filter-row{ display: contents; }

  /* Selected chips physically glide between the pool and the selected zone
     via FLIP (see toggleFilter in JS). No entry keyframe needed. */
  #selected-filters:empty{ display: none; }

  @media (max-width: 639px){
    #filters{
      flex: 1 1 100%;               /* full-width line of its own */
      display: flex;
      flex-direction: column;        /* exactly three stacked rows */
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;             /* the three rows scroll together */
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #filters::-webkit-scrollbar{ display: none; }
    #filters .filter-row{
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      width: max-content;           /* row is exactly as wide as its pills */
      flex: 0 0 auto;
    }
    #filters .filter-row > button{
      flex: 0 0 auto;               /* each pill = its own text width */
      white-space: nowrap;
    }
  }
</style>

<script>
/* THE DIRECTORY LIVES IN THE DATABASE (origination arc, iteration 3): every
   wiki — identity, tags, tagline, status, tile cover, stats — and the MERGED
   category taxonomy (the canon 12 + admin-originated ones, colors resolved)
   arrive from the platform's public feed. Originate a wiki in the build kit
   and its tile (and any new category's chip) appears here automatically.
   Hardcoded below is only what should be: the hand-coded bespoke cover ART
   (referenced by each wiki's tile_cover.cls) and the "All" filter
   pseudo-chip (page UI, not a category). */
const DIRECTORY_URL = 'https://vizwiki.vercel.app/api/directory';
let CATEGORIES = [{key:"all",label:"All",icon:"sparkles"}];
let WIKIS = [];

let selected = new Set(), sort = "popular", q = "";

const el = (id) => document.getElementById(id);
const catBy = (k) => CATEGORIES.find(c=>c.key===k);


// Collect every filter chip currently on screen, keyed by category, with its
// screen rectangle. Used by FLIP to animate chips physically between zones.
function chipRects(){
  const map = new Map();
  document.querySelectorAll('#selected-filters > button, #filters button').forEach(b=>{
    map.set(b.dataset.cat, b.getBoundingClientRect());
  });
  return map;
}

function toggleFilter(key){
  // 1. FIRST — measure where every chip is right now
  const firstRects = chipRects();

  // 2. mutate state + re-render (chips jump to their new DOM positions)
  if(key === 'all'){ selected.clear(); }              // "All" = clear every selection
  else if(selected.has(key)){ selected.delete(key); } // already up → drop it back
  else { selected.add(key); }                          // lift it up
  renderFilters(); renderList();

  // 3. LAST + INVERT + PLAY — for each chip that existed before, compute the
  //    delta from its old spot to its new spot, snap it back to the old spot
  //    with no transition, then release it so it glides to the new one.
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion) return;

  document.querySelectorAll('#selected-filters > button, #filters button').forEach(b=>{
    const prev = firstRects.get(b.dataset.cat);
    const now  = b.getBoundingClientRect();
    if(prev){
      const dx = prev.left - now.left;
      const dy = prev.top  - now.top;
      if(dx || dy){
        b.style.transition = 'none';
        b.style.transform  = `translate(${dx}px, ${dy}px)`;
        b.style.position   = 'relative';
        b.style.zIndex     = '5';
        // force reflow so the starting transform is committed before we animate
        b.getBoundingClientRect();
        requestAnimationFrame(()=>{
          b.style.transition = 'transform .32s cubic-bezier(.22,.61,.36,1)';
          b.style.transform  = '';
        });
        // once the glide finishes, strip inline styles so Tailwind's hover
        // transition (the `transition` class) takes over again cleanly
        b.addEventListener('transitionend', function done(){
          b.style.transition = '';
          b.style.transform  = '';
          b.style.position   = '';
          b.style.zIndex     = '';
          b.removeEventListener('transitionend', done);
        });
      }
    } else {
      // brand-new chip (shouldn't normally happen here) — gentle fade-in
      b.style.transition = 'none';
      b.style.opacity = '0';
      requestAnimationFrame(()=>{
        b.style.transition = 'opacity .25s ease-out';
        b.style.opacity = '';
      });
    }
  });
}

function renderFilters(){
  const isOn = (k) => selected.has(k);
  const emptySel = selected.size === 0;

  // A pool chip (unselected). data-zone="pool" so we know where the click came from.
  const poolPill = (c) => `
    <button data-cat="${c.key}" data-zone="pool" class="rounded-full border px-3 py-1 font-mono-acc text-[10px] uppercase tracking-wider transition ${ (c.key==='all' && emptySel) ? 'border-hp bg-hp text-white' : 'border-foreground/25 text-muted-foreground hover:border-foreground hover:text-foreground'}">${c.label}</button>`;

  // A selected (floated-up) chip — active styling + a × to drop it back.
  const selPill = (c) => `
    <button data-cat="${c.key}" data-zone="selected" class="inline-flex items-center gap-1 rounded-full border border-hp bg-hp px-3 py-1 font-mono-acc text-[10px] uppercase tracking-wider text-white transition hover:opacity-90">${c.label}<span aria-hidden="true" class="text-white/80">×</span></button>`;

  // ── Selected zone (next to "Filter:") — the chips that floated up ──
  const selectedCats = CATEGORIES.filter(c => c.key !== 'all' && isOn(c.key));
  el('selected-filters').innerHTML = selectedCats.map(selPill).join('');

  // ── Pool — 3 balanced rows, but OMIT any chip that's currently selected ──
  // (omitting, not hiding, is what makes the row compress to fill the gap)
  const pool = CATEGORIES.filter(c => !isOn(c.key));   // drops selected genres; "all" stays unless something is selected
  const visiblePool = pool.filter(c => !(c.key === 'all' && !emptySel)); // hide "All" once a genre is chosen
  const rows = [[],[],[]];
  let rem = visiblePool.length, idx = 0;
  for(let r=0; r<3; r++){ const n = Math.ceil(rem/(3-r)); rows[r] = visiblePool.slice(idx, idx+n); idx += n; rem -= n; }
  el('filters').innerHTML = rows.map(row=>`<div class="filter-row">${row.map(poolPill).join('')}</div>`).join('');

  // wire both zones to the same toggle
  el('filters').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=> toggleFilter(b.dataset.cat));
  });
  el('selected-filters').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=> toggleFilter(b.dataset.cat));
  });

  const sorts = [["popular","Most popular"],["az","A–Z"],["entries","Most entries"]];
  el('sorts').innerHTML = sorts.map(([k,l])=>`
    <button data-sort="${k}" class="rounded-sm border px-3 py-1 font-mono-acc text-[10px] uppercase tracking-wider transition ${sort===k?'border-hp bg-hp text-white':'border-foreground/25 text-muted-foreground hover:border-foreground hover:text-foreground'}">${l}</button>
  `).join('');
  el('sorts').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{ sort=b.dataset.sort; renderFilters(); renderList(); });
  });
}

/* The BESPOKE cover ART of the 5 built wikis — hand-coded decoration, keyed
   by the cover class each wiki's tile_cover.cls REFERENCES from the database
   (the art stays here until the design-system arc canonizes it). */
const BESPOKE = {
  "c-tacobell": { vol:"Vol. 1", inner:`
    <div class="halftone"></div>
    <svg class="bell" viewBox="0 0 100 100" fill="#fff" aria-hidden="true"><path d="M50 18c-20 0-34 14-36 40-1 9 5 14 14 14h44c9 0 15-5 14-14C84 32 70 18 50 18Z"/><rect x="12" y="74" width="76" height="10" rx="5"/></svg>` },
  "c-fallout": { vol:"Vol. 2", inner:`
    <div class="glow"></div><div class="scan"></div>
    <div class="term" aria-hidden="true">ROBCO TERMLINK<br>VAULT-TEC<br>&gt; RUN WIKI.EXE<br>&gt; ACCESS GRANTED ▮</div>`, titleSuffix:`<span class="cursor"></span>` },
  "c-apple": { vol:"Vol. 3", inner:`

const esc = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function coverTile(w){
  const cat = catBy((w.categories||[])[0]);
  // the genre corner lists EVERY tag the wiki wears (first tag still drives
  // the themed gradient/glyph); the blurb surfaces as the tile's tooltip
  const genre = (w.categories||[]).map(k => { const c = catBy(k); return c ? c.label : null; }).filter(Boolean).join(' · ') || 'Wiki';
  const tip = w.blurb ? ` title="${esc(w.blurb)}"` : '';
  const cover = w.tile_cover || {};
  // live flagship (bespoke cover) → its built page here; any other live wiki
  // is DB-native and reads on the platform's reader; coming soon → no link
  const href = w.status !== 'live' ? '#'
    : cover.kind === 'bespoke' ? (w.id + '.html')
    : ('https://vizwiki.vercel.app/read/' + encodeURIComponent(w.id));
  const tag = w.tagline || genre;
  const b = cover.cls ? BESPOKE[cover.cls] : null;
  if(b){
    // bespoke cover (built wiki) — hand-coded art + the DB's identity text
    return `<a class="cover ${cover.cls}" href="${href}"${tip}>
      ${b.inner}
      <div class="c-genre">${genre}</div>
      <div class="c-vol">${b.vol}</div>
      <div class="c-foot">
        <div class="c-title">${w.name}${b.titleSuffix||''}</div>
        <div class="c-blurb">${tag}</div>
      </div>
    </a>`;
  }
  // per-wiki cover ART (uploaded image + legibility scrim), else the themed
  // cover — gradient + glyph derived from the wiki's first category
  const art = cover.kind === 'art' && cover.src
    ? `background-image:linear-gradient(to top,rgba(10,8,12,.78) 0%,rgba(10,8,12,.12) 45%,rgba(10,8,12,.18) 100%),url('${cover.src}');background-size:cover;background-position:center`
    : `background-image:linear-gradient(to bottom right,${cat?cat.from:'#2a2630'},${cat?cat.to:'#4a4454'})`;
  return `<a class="cover c-themed" href="${href}" style="${art}"${tip}>
    ${cover.kind === 'art' ? '' : `<div class="sheen"></div>
    ${cat && cat.iconSvg
      ? `<svg class="wiki-icon glyph" viewBox="0 0 24 24">${cat.iconSvg}</svg>`
      : `<svg class="wiki-icon glyph"><use href="#ic-${cat?cat.icon:'sparkles'}"></use></svg>`}`}
    <div class="c-genre">${genre}</div>
    <span class="c-soon">${w.status === 'coming_soon' ? 'Coming soon' : 'Indexed'}</span>
    <div class="c-foot">
      <div class="c-title">${w.name}</div>
      <div class="c-blurb">${tag}</div>
    </div>
  </a>`;
}

function renderList(){
  let list = WIKIS.slice();
  if(selected.size > 0) list = list.filter(w => (w.categories||[]).some(k => selected.has(k)));
  if(q.trim()){ const s=q.toLowerCase(); list=list.filter(w=>w.name.toLowerCase().includes(s)||(w.blurb||'').toLowerCase().includes(s)); }
  if(sort==='popular') list.sort((a,b)=>b.popularity-a.popularity);
  if(sort==='az') list.sort((a,b)=>a.name.localeCompare(b.name));
  if(sort==='entries') list.sort((a,b)=>b.entries-a.entries);
  el('hits').textContent = list.length+' hits';
  if(list.length===0){
    el('list').innerHTML = `<div class="border border-dashed border-foreground/25 bg-card p-12 text-center text-muted-foreground">No wikis match those filters.</div>`;
    return;
  }
  el('list').innerHTML = `<div class="cover-grid">${ list.map(coverTile).join('') }</div>`;
}

el('q').addEventListener('input', e=>{ q=e.target.value; renderList(); });

// ── boot: fetch the directory, then render everything from it ──
(async function boot(){
  el('list').innerHTML = `<div class="p-12 text-center font-mono-acc text-[10px] uppercase tracking-wider text-muted-foreground">Loading the library…</div>`;
  renderFilters();
  try{
    const dir = await (await fetch(DIRECTORY_URL)).json();
    CATEGORIES = [{key:"all",label:"All",icon:"sparkles"}, ...(dir.categories||[])];
    WIKIS = dir.wikis || [];
    el('totalCount').textContent = WIKIS.length.toLocaleString();
    renderFilters(); renderList();
  }catch(e){
    el('list').innerHTML = `<div class="border border-dashed border-foreground/25 bg-card p-12 text-center text-muted-foreground">The wiki directory is unreachable right now — refresh to try again.</div>`;
  }
})();

</script>
