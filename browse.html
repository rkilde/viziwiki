<style>
  /* Keep the sticky filter row parked below the global main-bar.
     Fallback to 0 so it still sticks where --main-h is undefined
     (e.g. the standalone artifact preview, with no layout chrome). */
  .sticky.top-0 { top: var(--main-h, 0px); }

  /* Filter pills render as three explicit rows (.filter-row). On desktop the
     rows dissolve (display:contents) so pills wrap normally; on mobile they
     become three real rows packed left-to-right that scroll horizontally. */
  .filter-row{ display: contents; }

  /* Selected chips physically glide between the pool and the selected zone
     via FLIP (see toggleFilter in JS). No entry keyframe needed. */
  #selected-filters:empty{ display: none; }

  @media (max-width: 639px){
    #filters{
      flex: 1 1 100%;               /* full-width line of its own */
      display: flex;
      flex-direction: column;        /* exactly three stacked rows */
      flex-wrap: nowrap;
      gap: 6px;
      overflow-x: auto;             /* the three rows scroll together */
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #filters::-webkit-scrollbar{ display: none; }
    #filters .filter-row{
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      width: max-content;           /* row is exactly as wide as its pills */
      flex: 0 0 auto;
    }
    #filters .filter-row > button{
      flex: 0 0 auto;               /* each pill = its own text width */
      white-space: nowrap;
    }
  }
</style>

const catBy = (k) => CATEGORIES.find(c=>c.key===k);


// Collect every filter chip currently on screen, keyed by category, with its
// screen rectangle. Used by FLIP to animate chips physically between zones.
function chipRects(){
  const map = new Map();
  document.querySelectorAll('#selected-filters > button, #filters button').forEach(b=>{
    map.set(b.dataset.cat, b.getBoundingClientRect());
  });
  return map;
}

function toggleFilter(key){
  // 1. FIRST — measure where every chip is right now
  const firstRects = chipRects();

  // 2. mutate state + re-render (chips jump to their new DOM positions)
  if(key === 'all'){ selected.clear(); }              // "All" = clear every selection
  else if(selected.has(key)){ selected.delete(key); } // already up → drop it back
  else { selected.add(key); }                          // lift it up
  renderFilters(); renderList();

  // 3. LAST + INVERT + PLAY — for each chip that existed before, compute the
  //    delta from its old spot to its new spot, snap it back to the old spot
  //    with no transition, then release it so it glides to the new one.
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduceMotion) return;

  document.querySelectorAll('#selected-filters > button, #filters button').forEach(b=>{
    const prev = firstRects.get(b.dataset.cat);
    const now  = b.getBoundingClientRect();
    if(prev){
      const dx = prev.left - now.left;
      const dy = prev.top  - now.top;
      if(dx || dy){
        b.style.transition = 'none';
        b.style.transform  = `translate(${dx}px, ${dy}px)`;
        b.style.position   = 'relative';
        b.style.zIndex     = '5';
        // force reflow so the starting transform is committed before we animate
        b.getBoundingClientRect();
        requestAnimationFrame(()=>{
          b.style.transition = 'transform .32s cubic-bezier(.22,.61,.36,1)';
          b.style.transform  = '';
        });
        // once the glide finishes, strip inline styles so Tailwind's hover
        // transition (the `transition` class) takes over again cleanly
        b.addEventListener('transitionend', function done(){
          b.style.transition = '';
          b.style.transform  = '';
          b.style.position   = '';
          b.style.zIndex     = '';
          b.removeEventListener('transitionend', done);
        });
      }
    } else {
      // brand-new chip (shouldn't normally happen here) — gentle fade-in
      b.style.transition = 'none';
      b.style.opacity = '0';
      requestAnimationFrame(()=>{
        b.style.transition = 'opacity .25s ease-out';
        b.style.opacity = '';
      });
    }
  });
}

function renderFilters(){
  const isOn = (k) => selected.has(k);
  const emptySel = selected.size === 0;

  // A pool chip (unselected). data-zone="pool" so we know where the click came from.
  const poolPill = (c) => `
    <button data-cat="${c.key}" data-zone="pool" class="rounded-full border px-3 py-1 font-mono-acc text-[10px] uppercase tracking-wider transition ${ (c.key==='all' && emptySel) ? 'border-hp bg-hp text-white' : 'border-foreground/25 text-muted-foreground hover:border-foreground hover:text-foreground'}">${c.label}</button>`;

  // A selected (floated-up) chip — active styling + a × to drop it back.
  const selPill = (c) => `
    <button data-cat="${c.key}" data-zone="selected" class="inline-flex items-center gap-1 rounded-full border border-hp bg-hp px-3 py-1 font-mono-acc text-[10px] uppercase tracking-wider text-white transition hover:opacity-90">${c.label}<span aria-hidden="true" class="text-white/80">×</span></button>`;

  // ── Selected zone (next to "Filter:") — the chips that floated up ──
  const selectedCats = CATEGORIES.filter(c => c.key !== 'all' && isOn(c.key));
  el('selected-filters').innerHTML = selectedCats.map(selPill).join('');

  // ── Pool — 3 balanced rows, but OMIT any chip that's currently selected ──
  // (omitting, not hiding, is what makes the row compress to fill the gap)
  const pool = CATEGORIES.filter(c => !isOn(c.key));   // drops selected genres; "all" stays unless something is selected
  const visiblePool = pool.filter(c => !(c.key === 'all' && !emptySel)); // hide "All" once a genre is chosen
  const rows = [[],[],[]];
  let rem = visiblePool.length, idx = 0;
  for(let r=0; r<3; r++){ const n = Math.ceil(rem/(3-r)); rows[r] = visiblePool.slice(idx, idx+n); idx += n; rem -= n; }
  el('filters').innerHTML = rows.map(row=>`<div class="filter-row">${row.map(poolPill).join('')}</div>`).join('');

  // wire both zones to the same toggle
  el('filters').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=> toggleFilter(b.dataset.cat));
  });
  el('selected-filters').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=> toggleFilter(b.dataset.cat));
  });

  const sorts = [["popular","Most popular"],["az","A–Z"],["entries","Most entries"]];
  el('sorts').innerHTML = sorts.map(([k,l])=>`
    <button data-sort="${k}" class="rounded-sm border px-3 py-1 font-mono-acc text-[10px] uppercase tracking-wider transition ${sort===k?'border-hp bg-hp text-white':'border-foreground/25 text-muted-foreground hover:border-foreground hover:text-foreground'}">${l}</button>
  `).join('');
  el('sorts').querySelectorAll('button').forEach(b=>{
    b.addEventListener('click',()=>{ sort=b.dataset.sort; renderFilters(); renderList(); });
  });
}

/* Short index-style taglines per wiki (the 5 built + 7 others use index's
   exact text; the rest match that clean dot-separated style). Popularity and
   entry counts stay in the WIKIS data for filter/sort — just not displayed. */
const TAGLINES = {
  "Taco Bell":"Menus · Sauces · Slogans",
  "Fallout":"Factions · Timeline",
  "Apple":"Products · Timeline",
  "Smurfs' Village":"Buildings · Lore",
  "Doodle Jump":"Platforms · Monsters",
  "Star Wars":"Saga · Characters · Lore",
  "Pokémon":"Pokédex · Regions · Games",
  "Taylor Swift":"Eras · Discography",
  "One Piece":"Arcs · Crews · Devil Fruits",
  "Formula 1":"Teams · Circuits · Seasons",
  "Marvel Cinematic Universe":"Phases · Heroes · Timeline",
  "Minecraft":"Blocks · Mobs · Biomes",
  "Dune":"Houses · Spice · Lore",
  "BTS":"Members · Eras · Discography",
  "The Legend of Zelda":"Games · Items · Timeline",
  "Studio Ghibli":"Films · Characters · Lore",
  "McDonald's":"Menu · History · Promos",
  "Naruto":"Villages · Jutsu · Clans",
  "NBA":"Teams · Players · Seasons",

  "Squid Game":"Games · Players · Lore",
};

function coverTile(w){
  const cat = catBy(w.category);
  const href = w.url || '#';
  const tag = TAGLINES[w.name] || cat.label;
  const b = BESPOKE[w.name];
  if(b){
    // bespoke cover (built wiki) — matches index exactly: genre + Vol., title + tagline
    return `<a class="cover ${b.cls}" href="${href}">
      ${b.inner}
      <div class="c-genre">${cat.label}</div>
      <div class="c-vol">${b.vol}</div>
      <div class="c-foot">
        <div class="c-title">${w.name}${b.titleSuffix||''}</div>
        <div class="c-blurb">${tag}</div>
      </div>
    </a>`;
  }
  // themed cover — matches index exactly: genre + Indexed badge, title + tagline
  return `<a class="cover c-themed ${cat.grad}" href="${href}">
    <div class="sheen"></div>
    <i data-lucide="${cat.icon}" class="glyph" stroke-width="1.5"></i>
    <div class="c-genre">${cat.label}</div>
    <span class="c-soon">Indexed</span>
    <div class="c-foot">
      <div class="c-title">${w.name}</div>
      <div class="c-blurb">${tag}</div>
    </div>
  </a>`;
}

function renderList(){
  let list = WIKIS.slice();
  if(selected.size > 0) list = list.filter(w => selected.has(w.category));
  if(q.trim()){ const s=q.toLowerCase(); list=list.filter(w=>w.name.toLowerCase().includes(s)||w.blurb.toLowerCase().includes(s)); }
  if(sort==='popular') list.sort((a,b)=>b.popularity-a.popularity);
  if(sort==='az') list.sort((a,b)=>a.name.localeCompare(b.name));
  if(sort==='entries') list.sort((a,b)=>b.entries-a.entries);
  el('hits').textContent = list.length+' hits';
  if(list.length===0){
    el('list').innerHTML = `<div class="border border-dashed border-foreground/25 bg-card p-12 text-center text-muted-foreground">No wikis match those filters.</div>`;
    return;
  }
  el('list').innerHTML = `<div class="cover-grid">${ list.map(coverTile).join('') }</div>`;
  if(window.lucide) lucide.createIcons();   // draw the genre glyphs on themed covers
}

el('q').addEventListener('input', e=>{ q=e.target.value; renderList(); });
el('totalCount').textContent = WIKIS.length.toLocaleString();
renderFilters(); renderList();

lucide.createIcons();
</script>
