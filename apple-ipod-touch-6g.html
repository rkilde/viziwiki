    heading: "The longest wait in the line — answered with the iPhone 6's brain.",
    paragraphs: [
      "The sixth generation iPod touch was released through the online Apple Store on July 15, 2015, alongside refreshed colours for the iPod nano and iPod shuffle. It was the first major update to the iPod touch in more than two and a half years — the 5th generation had launched in September 2012 — and Apple framed it as \"the best iPod touch yet.\" Manufactured by Foxconn, it carried the model number A1574 and the firmware identifier iPod7,1.",
      "The headline was the processor. The 6G adopted the 64-bit Apple A8 — the same system-on-chip as the iPhone 6 and 6 Plus, the iPad mini 4, and later the Apple TV HD and HomePod — paired with the M8 motion coprocessor. RAM doubled from 512 MB to 1 GB of LPDDR3. The rear camera jumped from 5 MP to an 8 MP iSight with 1080p video, and Wi-Fi gained 802.11ac support. For the first time, the iPod touch shipped with the current iPhone's processor rather than a hand-me-down a generation or two behind.",
      "The colour story expanded. The 6G launched in space gray, silver, gold, pink, blue, and (PRODUCT)RED. Gold was new to the line, mirroring the iPhone's 2013 expansion. The space gray model had a black glass front; the other five had white fronts. The aluminium unibody was retained, but the pop-out Loop button — the signature flourish of the 5G — was quietly removed, leaving the only visible external difference between the two generations.",
      "Storage was the most generous the line had ever offered: 16, 32, 64, and 128 GB, priced at $199, $249, $299, and $399. The 128 GB tier was a first for any iPod touch. The device shipped with iOS 8.4, released two weeks earlier on June 30, 2015 alongside Apple Music and the Beats 1 radio station — making the 6G one of the launch vehicles for Apple's streaming era.",
      "There was a catch buried in the spec sheet. The A8 in the 6G was underclocked to 1.1 GHz, down from the 1.4 GHz of the iPhone 6, a concession to the smaller battery. The 16 GB base model also drew criticism for being cramped in the iOS 9 era. Still, the device aged remarkably well: it received iOS 9 through 12, was the oldest device to support iOS 10.3, and Apple has continued shipping iOS 12 security updates — the most recent, iOS 12.5.8, arrived in January 2026, more than a decade after launch. It was discontinued in two stages: the 16 and 64 GB tiers on July 27, 2017, and the 32 and 128 GB tiers on May 28, 2019, when the 7th generation arrived."
