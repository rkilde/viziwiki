# ════════════════════════════════════════════════════════════════════
# VISUAL BANK REGISTRY  (the heart of the 1.0 builder)
# --------------------------------------------------------------------
# Maps a visual TYPE → its component partial + the add-ons it allows.
# The dispatcher (_includes/visual.html) routes a {type, data} pair to
# the right partial. The future builder reads THIS file to populate the
# component picker and to validate which add-ons are legal per type.
# Add a bank component = add one entry here + its partial under
# _includes/visuals/<bank>/.
# ════════════════════════════════════════════════════════════════════

# A SECTION frames a visual: it owns the chrome a contributor gets the
# moment they drop the section (locked eyebrow + auto-derived summary +
# footnote) and a SLOT routed through the dispatcher. The VISUAL is what
# fills the slot. Summary values derive from the slotted visual's data, so
# the count is never hand-typed (`unit` sets the noun, default "item").
sections:
  hero:
    partial: sections/hero.html
    variants: [home, page]             # home adds search + (usually) a spotlight aside
    parts:                             # each is its own single-source partial
      stats: hero/stats.html           # 1×4 key-numbers grid (canon = exactly 4)
      search: hero/search.html         # HOME heroes only
      spotlight: hero/spotlight.html   # aside treatment 1 — card
      feature: hero/feature.html       # aside treatment 2 — feature
    content_fields: [title, eyebrow, desc, stats, search, spotlight, feature]
    decoration_fields: [bg, accent, icon, overlays, watermark, id, class]  # skin/admin
    locked: [title-period, eyebrow-dot, search-icon]   # decorations, not editable
  overview-section:
    partial: sections/overview.html
    eyebrow: "Overview"                # locked
    icon: book-open                    # locked
    h2: required                       # contributor-named
    parts:
      infobox: overview/infobox.html   # optional fact panel (bank type #1)
    content_fields: [heading, paragraphs, infobox]
    config_fields: [tone, id, eyebrow]
  catalog-section:
    partial: sections/catalog-section.html
    eyebrow: "Full Catalog"            # locked
    summary: derived                   # "{n} {unit}s · {m} categories"
    addons: [footnote]
    hosts: [catalog]                   # visuals legal in the slot
  timeline-section:
    partial: sections/timeline-section.html
    eyebrow: "Timeline"                # locked
    icon: move-horizontal              # locked
    h2: optional
    summary: derived                   # auto "Scroll · first → last"
    full_bleed: true                   # locked edge-to-edge scroller
    hosts: [timeline]                  # visuals legal in the slot
  delta-section:
    partial: sections/delta-section.html
    eyebrow: "Changes & Improvements"  # locked
    icon: chart-column-stacked         # locked
    h2: required
    contained: true                    # NOT full-bleed
    addons: [intro, footnote]
    hosts: [delta]                     # visuals legal in the slot
  spec-section:
    partial: sections/spec-section.html
    eyebrow: "Specifications Sheet"    # locked
    icon: file-text                    # locked
    h2: required
    device: required                   # the "name · model number" line
    contained: true                    # NOT full-bleed; normal (light) tone
    hosts: [spec]
  config-section:
    partial: sections/config-section.html
    eyebrow: "Configurations"          # locked
    icon: hard-drive                   # locked
    h2: required
    contained: true                    # NOT full-bleed
    hosts: [config]                    # visuals legal in the slot
  os-section:
    partial: sections/os-section.html
    eyebrow: "Operating system support"  # locked
    icon: layers                       # locked
    h2: required
    paragraphs: optional               # lead prose above the ribbon
    contained: true                    # NOT full-bleed
    hosts: [lane]                      # visuals legal in the slot

config:
  bank: charts
  partial: visuals/config/config.html
  section: config-section
  bar_fill: derived                    # width = exact proportion of capacity (GB/TB normalized), no floor
  units: [GB, TB]
  addons: [revised, divider_label, price-drop, color-dots]
  colors: skin-derived                 # chrome via --cfg-* tokens; device dots are content hex
  item_fields: [capacity, unit, model, price, dates, revised, colors]

delta:
  bank: comparisons
  partial: visuals/delta/delta.html
  section: delta-section
  axes: [prev, current]
  row_groups: [hardware, software]
  row_fields: [label, old, new, no_old, chip, chip_text]
  chips: [better, feature, changed, worse, same]   # colour = the change direction; text = the value
  colors: skin-derived                              # chrome via --gd-* tokens (Apple pinned)

spec:
  bank: spec-sheets
  partial: visuals/spec/spec.html
  section: spec-section
  card_fields: [title, icon, rows]
  colors: skin-derived                              # chrome via --spec-* tokens

lane:
  bank: timelines
  partial: visuals/lane/lane.html
  section: os-section
  width_model: [uniform, weighted]     # weighted = width ∝ date gap (opt-in via `weighted: true` + dates)
  range: derived                       # auto "first date → last supported date" (+ optional range_note)
  legend: derived                      # auto from the support types present
  segment_fields: [ver, date, type, badge, badge_type]
  types: [full, partial, dropped]      # support tier → fill colour
  badge_types: [ship, paid, limited, final, dropped]
  note_fields: [status, label, text]   # status → dot colour (full/partial/limited/final/dropped)
  colors: skin-derived                 # chrome via --lane-* tokens; support palette = semantic defaults

timeline:
  bank: timelines
  partial: visuals/timeline/timeline.html
  section: timeline-section
  card_types: [station]                # only one card type for now
  pairs_with: detail-modal             # each card opens this
  event_fields: [month, day, year, tag, title, preview, body]

catalog:
  bank: lists
  partial: visuals/catalog/catalog.html
  section: catalog-section             # the framing it slots into
  pairs_with: expandable-card          # each item opens this
  category_color: skin-swatch          # `color: N` -> --cat-accent-N (else auto-cycle)
  addons: [ribbon]                     # catalog-level add-ons
  ribbon_tones: [accent, gone]         # accent = category color; gone = locked skin grey ("phased out")
  card_addons: [status, info-chip, pill-group, callout, notes]   # expandable-card add-ons
  status_states: [active, discontinued, retired, limited] # pre-defined set
