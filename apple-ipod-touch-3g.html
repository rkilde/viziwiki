    preview:"50% faster. 256 MB RAM. Gaming GPU. Philip Schiller pitches it against the DS and PSP.",
    body:"<p>Apple's \"It's Only Rock and Roll\" event unveiled the 3rd generation iPod touch. Philip Schiller led the introduction, positioning the device explicitly as a gaming platform and benchmarking it against the Nintendo DS and PlayStation Portable. The App Store already carried over 21,000 game titles.</p><p>Unlike previous iPod touch generations, the 3G launched and shipped on the same day. The 32 GB ($299) and 64 GB ($399) models were available immediately. An 8 GB model at $199 was also listed — but used 2nd generation internals, not the new Cortex-A8 hardware.</p>"

    title:"The 8GB discrepancy.",
    preview:"Apple lists an 8GB model. It is a 2nd generation device in everything but name.",
    body:"<p>Simultaneously with the keynote, Apple updated the entry-level price point with an 8 GB iPod touch at $199. This model did not carry the new 3rd generation internals — no Cortex-A8, no 256 MB RAM, no Voice Control hardware. It was the 2nd generation MC revision sold alongside the new device.</p><p>Apple never explicitly labelled it as 2nd generation in this context. Resellers and media compounded the confusion by listing it as a 3rd generation model. The distinction remained a persistent source of misidentification in secondary markets for years.</p>"

    body:"<p>iPhone OS 3.1.3 was the last software release to carry the \"iPhone OS\" name. It addressed battery accuracy reporting bugs and security vulnerabilities. No new features were introduced for iPod touch users.</p><p>The following summer, Apple rebranded the platform as iOS at WWDC 2010 — a deliberate move to signal that the operating system was no longer iPhone-centric. The 3rd generation iPod touch would receive every major iOS release through version 5.</p>"

    preview:"Multitasking and wallpapers confirmed for 3G. The 2G is explicitly cut off.",
    body:"<p>At Apple's iOS 4 preview event, the company confirmed that the 3rd generation iPod touch would receive full iOS 4 support — including native multitasking and custom home screen wallpapers. The 2nd generation was explicitly excluded from both features due to hardware limitations.</p><p>This confirmation drew a clear line between the two generations. The 3G's doubled RAM and Cortex-A8 architecture gave it the headroom the 2G lacked. For owners who had bought a 3G specifically for its internals, the announcement validated the purchase.</p>"

    preview:"App folders, multitasking, wallpapers. First iPod touch major update shipped free.",
    body:"<p>iOS 4 launched with complete feature support on the 3rd generation iPod touch. App folders, unified Mail, home screen wallpapers, and multitasking hooks all present — no exclusions, unlike the 2G's stripped-down iOS 4 experience.</p><p>Critically, this was the first major iOS upgrade delivered free to iPod touch users. Previous major versions — iPhone OS 2.0 and 3.0 — had required a $9.95 purchase due to Sarbanes-Oxley accounting rules. Apple cited a change in revenue recognition methodology for dropping the fee.</p>"

    preview:"One year on sale. Replaced by the 4th generation with Retina display and cameras.",
    body:"<p>Apple discontinued the 3rd generation iPod touch on September 1, 2010 — exactly one year after launch — replacing it with the 4th generation iPod touch. The 4G brought Apple's A4 chip, a Retina display at 960×640, and both front and rear-facing cameras.</p><p>The camera inclusion on the 4G made the 3G's missing-camera story feel retroactively stranger. Whatever had prevented a camera in September 2009 had been resolved by September 2010. Apple never commented on the gap.</p>"

    preview:"Game Center launches on the 3G. Multiplayer matchmaking, leaderboards, achievements.",
    body:"<p>iOS 4.1 introduced Game Center to the 3rd generation iPod touch — Apple's native multiplayer gaming platform with matchmaking, leaderboards, and achievements. The 3G's 256 MB RAM and SGX535 GPU made it a capable Game Center device for most titles through 2011.</p><p>The update also introduced HDR photo capabilities on devices with cameras — the 3G had no camera, but received the rest of the iOS 4.1 feature set without issue.</p>"

    preview:"AirPlay, AirPrint, and free Find My iPod tracking come to the 3G.",
    body:"<p>iOS 4.2.1 brought AirPlay audio and video streaming, AirPrint wireless printing, and a free tier of Find My iPod touch — previously a paid MobileMe feature — to the 3rd generation. The update unified the iOS feature set across iPhone, iPod touch, and iPad for the first time.</p><p>This was the same version number that ended 2nd generation software support entirely. For 3G owners, it was simply another update in a continuing sequence that would run for nearly two more years.</p>"

    body:"<p>iOS 4.3 integrated the Nitro JavaScript engine into mobile Safari, delivering a dramatic improvement in web performance on the 3rd generation's Cortex-A8 processor. Benchmark scores roughly doubled. Pages that had felt sluggish loaded noticeably faster.</p><p>The update also brought iTunes Home Sharing improvements and Personal Hotspot — the latter iPhone-only, but the performance lift in Safari was universally felt. iOS 4.3 was the last significant feature update before iOS 5 completed the 3G's software lifecycle.</p>"

    preview:"The 3G's penultimate major version. OTA updates arrive. Siri does not.",
    body:"<p>iOS 5 brought iCloud backup, iMessage Wi-Fi messaging, Notification Center, Reminders, and over-the-air updates to the 3rd generation iPod touch. It was the device's penultimate major iOS version and the first update that could be applied without connecting to a computer.</p><p>Siri, introduced simultaneously on iPhone 4S, was not available on the 3G. The 256 MB RAM ceiling became increasingly visible under iOS 5 — Safari tabs reloaded more aggressively, and the system carried a heavier memory footprint than iOS 4. The device remained functional but was beginning to show its age.</p>"

    body:"<p>iOS 5.0.1 addressed significant battery drain issues that had emerged after the iOS 5.0 launch, along with bug fixes for iCloud storage syncing and accessibility improvements. It was delivered entirely over the air — no iTunes connection required — marking a milestone in how Apple distributed software updates.</p><p>For 3G users, the battery fix was particularly relevant given the device's already reduced audio playback time compared to the 2G.</p>"
  },
  {

    title:"iOS 5.1.1 — the final update.",

    body:"<p>iOS 5.1.1 was the last software update Apple delivered to the 3rd generation iPod touch. Released primarily as a stability and security fix — addressing iCloud syncing bugs, battery drainage, and Safari reliability — it closed the device's software lifecycle at 32 months from launch.</p><p>iOS 6, announced in June 2012 and released in September, excluded the device entirely. The iPhone 3GS — sharing the same ARMv7 Cortex-A8 architecture — received iOS 6. No explanation was offered for the asymmetric treatment.</p>"
  },
  {

    body:"<p>iOS 6 launched alongside the iPhone 5 and 5th generation iPod touch, with no support for the 3rd generation. The device's ARMv7 Cortex-A8 architecture nominally met the hardware requirements Apple cited for iOS 6 — the same SoC family used in the iPhone 3GS, which did receive iOS 6.</p><p>The practical consequence: a device discontinued in September 2010 lost active software support in September 2012. Less than 24 months of post-sale support for a device sold new at $299.</p>"
  },
  {

    body:"<p>In an unexpected move, Apple pushed a revised build of iOS 5.1.1 — build 9B206 — specifically to patch a severe SSL/TLS certificate verification vulnerability known as \"goto fail.\" The bug allowed man-in-the-middle attacks against secure connections on affected devices.</p><p>This was the absolute final software modification Apple ever delivered to 3rd generation iPod touch hardware. No subsequent updates of any kind were issued. The device's software history ends here — a security patch, not a feature, as the last chapter.</p>"
