      {icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2"/><path d="M15 20v2"/><path d="M2 15h2"/><path d="M2 9h2"/><path d="M20 15h2"/><path d="M20 9h2"/><path d="M9 2v2"/><path d="M9 20v2"/></svg>',title:"Dormant Bluetooth chip", body:"The 2nd generation shipped with a Samsung/Broadcom Bluetooth chip inside every unit from September 2008 onward, but the chip was disabled at the firmware level. It was not enabled until iPhone OS 3.0 in June 2009 — nine months after launch. Apple never publicly explained why the chip shipped dormant. The decision to charge $9.95 to unlock hardware the user already owned compounded the controversy."},
      {icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',title:"iOS 4 feature exclusions", body:"When iOS 4.0 was released in June 2010, the 2G received the update but was excluded from multitasking, custom home screen wallpapers, and Bluetooth keyboard support. Some users and developers disputed this, noting that jailbroken 2G units could run basic multitasking with acceptable performance, and that the wallpaper restriction in particular seemed more like a product decision than a hardware limitation."},
      {icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>',title:"Jailbreak and BootROM exploit", body:"The original \"MB\" series models contained a hardware-level BootROM vulnerability that allowed unconditional jailbreaking — a persistent exploit that could not be patched via software update. Apple's response was the revised \"MC\" model in September 2009 with a patched BootROM. The original MB units remained permanently exploitable, creating a secondary market where un-patched 2G units commanded a premium."},
      {icon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>',title:"Performance degradation on iOS 4", body:"Users who upgraded to iOS 4.0 widely reported slower performance and reduced responsiveness compared to iPhone OS 3.1.3. Apple did not offer a way to downgrade once the update was installed, leaving users on a version of the operating system their hardware was not fully equipped to run smoothly. This pattern would recur across Apple's product line in later years and eventually result in regulatory scrutiny."},

var TIMELINE = [
  {dateKey:"Jul 2008",month:"Jul",day:"11",year:"2008",tag:"Software",title:"App Store launches.",preview:"500 apps. The 2G ships into a live ecosystem — and unlike 1st gen owners, pays nothing to access it.",body:"<p>Apple’s App Store opened alongside iPhone OS 2.0, transforming the iPod touch from a fixed-feature device into a software platform. At launch, approximately 500 apps were available. For iPod touch 1st generation owners, accessing the App Store required a $9.95 paid software update. The 2nd generation, launching two months later, shipped with App Store access built in at no charge. By the time the 2G went on sale, the store had already recorded 60 million downloads.</p>"},
  {dateKey:"Sep 2008",month:"Sep",day:"9",year:"2008",tag:"Launch",title:"iPod touch 2G unveiled.",preview:"Contoured stainless back. Speaker. Volume buttons. Nike+. Ships same day at $229, $299, $399.",body:"<p>At the Yerba Buena Center for the Arts in San Francisco, Apple introduced the 2nd generation iPod touch at its “Let’s Rock” keynote. A contoured, polished stainless steel back replaced the flat aluminium of the original, tapering toward the edges. Physical volume buttons appeared on the left edge for the first time. A mono speaker sat behind a grille at the top. Nike+iPod support was built in natively.</p><p>The device shipped the same day it was announced — running iPhone OS 2.1.1 out of the box, with full App Store access. Pricing was $229 (8GB), $299 (16GB), and $399 (32GB).</p>"},
  {dateKey:"Nov 2008",month:"Nov",day:"21",year:"2008",tag:"Software",title:"iPhone OS 2.2.",preview:"Street View in Maps. Transit routing. Podcast downloads over WiFi.",body:"<p>iPhone OS 2.2 was the first significant update the 2G received after launch. Google Street View was integrated into Maps. Public transit routing was added. Podcast downloading came to the iTunes app, letting users subscribe and receive episodes over WiFi without syncing to a computer.</p>"},
  {dateKey:"Feb 2009",month:"Feb",day:"5",year:"2009",tag:"Milestone",title:"20 million iPod touches sold.",preview:"Holiday demand for the 2G cited as the primary driver. A market validated fast.",body:"<p>Apple publicly announced that cumulative iPod touch sales had reached 20 million units worldwide. The 2nd generation model was credited as the primary driver of that demand surge — the redesigned form factor and native App Store access had significantly broadened the device’s appeal.</p>"},
  {dateKey:"Mar 2009",month:"Mar",day:"17",year:"2009",tag:"Software",title:"iPhone OS 3.0 previewed.",preview:"Bluetooth unlocked — the chip was always there, silently waiting.",body:"<p>At Apple’s campus in Cupertino, the company previewed iPhone OS 3.0. Among the announcements specific to the 2G: the update would unlock Bluetooth functionality — not by adding new hardware, but by enabling a Samsung/Broadcom chip that had been present inside the device from launch, silently dormant.</p>"},
  {dateKey:"Jun 2009",month:"Jun",day:"17",year:"2009",tag:"Software",title:"iPhone OS 3.0 ships.",preview:"Cut, copy, paste. Bluetooth gaming. Costs iPod touch users $9.95.",body:"<p>iPhone OS 3.0 was released as a free update for iPhone users. iPod touch owners were charged $9.95. Apple cited Sarbanes-Oxley accounting rationale. On the 2G, the update delivered cut, copy, and paste, Spotlight search, peer-to-peer Bluetooth gaming, and parental controls.</p>"},
  {dateKey:"Sep 2009",month:"Sep",day:"9",year:"2009",tag:"Hardware",title:"Lineup revised. MC model arrives.",preview:"16GB and 32GB discontinued. Revised 8GB MC at $199 patches the BootROM exploit.",body:"<p>Apple permanently discontinued the original 16GB and 32GB iPod touch 2G models. In their place, Apple introduced a revised 8GB model — the “MC” series (MC086LL/A) — distinguishable from the original “MB” line by an updated BootROM that patched a hardware-level jailbreak exploit. The revised model shipped at $199 with iPhone OS 3.1 pre-installed.</p>"},
  {dateKey:"Feb 2010",month:"Feb",day:"2",year:"2010",tag:"Software",title:"iPhone OS 3.1.3.",preview:"The last update the 2G runs without performance degradation.",body:"<p>iPhone OS 3.1.3 brought minor bug fixes and security patches. For the 2G specifically, it is widely regarded as the final software version the device ran without meaningful performance degradation — the hardware’s 128MB of RAM and ARMv6 processor were still adequate at this version.</p>"},
  {dateKey:"Jun 2010",month:"Jun",day:"21",year:"2010",tag:"Software",title:"iOS 4.0 — free, but limited.",preview:"First free major upgrade. No multitasking, no wallpapers. Hardware ceiling reached.",body:"<p>Apple released iOS 4.0 — the first time a major version upgrade was delivered to iPod touch users free of charge. Because the 2G featured only 128MB of RAM and an older ARMv6 processor, it could not support multitasking, custom home screen wallpapers, or Bluetooth keyboard support.</p>"},
  {dateKey:"Sep 2010",month:"Sep",day:"1",year:"2010",tag:"Hardware",title:"iPod touch 2G discontinued.",preview:"The 8GB MC model pulled. Entire 2nd generation family ends production.",body:"<p>On September 1, 2010, Apple removed the iPod touch 2nd generation 8GB MC model from sale, ending production for the entire 2nd generation family. Software support continued for another fourteen months.</p>"},
  {dateKey:"Nov 2010",month:"Nov",day:"22",year:"2010",tag:"Software",title:"iOS 4.2.1 — the final OS.",preview:"Game Center. AirPlay audio. The last software this hardware will ever run.",body:"<p>iOS 4.2.1 served as the final operating system for the iPod touch 2nd generation. It brought Game Center, AirPlay audio streaming, and on-device playlist creation. The limitations remained: no multitasking, no wallpapers, no Bluetooth keyboard.</p>"},
  {dateKey:"Mar 2011",month:"Mar",day:"9",year:"2011",tag:"Software",title:"iOS 4.3 drops the 2G.",preview:"Device absent from the compatibility list. Official support ends permanently.",body:"<p>Apple released iOS 4.3 on March 9, 2011, and the iPod touch 2nd generation was entirely absent from the device compatibility list. This was the formal end of software support. App Store applications requiring iOS 4.3 or later were immediately inaccessible.</p>"},
  {dateKey:"Jun 2011",month:"Jun",day:"",year:"2011",tag:"Legacy",title:"End of life. 60M units.",preview:"Total iPod touch sales surpass 60 million. The 2G was the primary driver.",body:"<p>As the 2nd generation reached true end-of-life status, Apple’s metrics showed total iPod touch sales across all generations had surpassed 60 million units worldwide. The 2nd generation had been the primary driver of adoption.</p>"}
