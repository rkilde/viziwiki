<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light only">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} · ViziWiki</title>

  <!-- Fonts (loaded once for the whole site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- ════════════════════════════════════════════════════════════════════
       NAV CHROME · CSS  — the brand identifier, shared across every page.
       Edit here and it updates everywhere on rebuild.
       ════════════════════════════════════════════════════════════════════ -->
  <style>
  {% raw %}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --hairline: rgba(255,255,255,.08);
    --text: rgba(255,255,255,.92);
    --dim: rgba(255,255,255,.6);
    --faint: rgba(255,255,255,.35);
    --vizi: #7dd3fc;
    --verse: #b794d4;
    --aol-gold: #ffd700;

    --main-h: 56px;
    --page-h: 76px;
  }

  html { scroll-behavior: smooth; overflow-y: scroll; overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    padding-top: calc(var(--main-h) + var(--page-h));
    padding-left: 0;
    min-height: 200vh;
    overflow-x: hidden;
    transition: padding-left .38s cubic-bezier(.2,.85,.2,1);
  }

  /* Per-facet color tokens (AOL example) */
  :root {
    --col: #0066cc;
    --col2: #ffd700;
  }
/* ─── MAIN BAR — LIGHT (white background) ─────────────────────── */
  .main-bar {
    position: fixed; top: 0; left: 0; right: 0;
    height: var(--main-h); z-index: 100;
    background: rgba(255, 255, 255, .94);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(10, 14, 26, .08);
    box-shadow: 0 2px 12px rgba(0, 0, 0, .22);
    display: flex; align-items: center; padding: 0 20px;
    will-change: transform;
    transition: transform .32s cubic-bezier(.4, 0, .2, 1);
  }
  .main-brand {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Fraunces', Georgia, serif;
    font-size: 21px; font-weight: 500;
    letter-spacing: -.015em;
    color: #0a0e1a; text-decoration: none;
  }
  .main-brand .diamond { width: 15px; height: 15px; color: #7c3aed; }
  .main-brand .vizi-half { color: #0284c7; }
  .main-nav { display: flex; gap: 4px; margin-left: 32px; }
  .main-nav a {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    color: rgba(10, 14, 26, .55); text-decoration: none;
    padding: 6px 12px; border-radius: 4px;
    transition: color .18s ease, background .18s ease;
  }
  .main-nav a:hover { color: #0a0e1a; background: rgba(10, 14, 26, .05); }
  .main-nav a.active { color: #0284c7; }
  .main-spacer { flex: 1; }
  .main-actions { display: flex; align-items: center; gap: 8px; }

  /* Icon button — DEFAULT for dark contexts (page bar save/share) */
  .main-icon-btn {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: var(--dim); cursor: pointer;
    background: transparent;
    border: 1px solid transparent; border-radius: 6px;
    transition: color .18s ease, background .18s ease, border-color .18s ease;
  }
  .main-icon-btn:hover { color: var(--text); background: rgba(255,255,255,.04); border-color: var(--hairline); }
  .main-icon-btn svg { width: 14px; height: 14px; }
  /* Icon button — LIGHT context override (main bar) */
  .main-bar .main-icon-btn { color: rgba(10, 14, 26, .55); }
  .main-bar .main-icon-btn:hover { color: #0a0e1a; background: rgba(10, 14, 26, .05); border-color: rgba(10, 14, 26, .1); }

  .main-account {
    width: 30px; height: 30px; border-radius: 50%;
    background: linear-gradient(135deg, #7c3aed, #0284c7);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-size: 13px; font-weight: 500;
    color: white; margin-left: 8px; cursor: pointer;
  }


  /* ═══════════════════════════════════════════════════════════════════
     MOBILE MAIN-BAR HAMBURGER + GLOBAL NAV DROPDOWN
     Hamburger sits to the left of the brand; opens a panel below the
     main bar containing Home/Browse/Vizi-verses/About.
     Hidden on web (where .main-nav is visible).
     ═══════════════════════════════════════════════════════════════════ */
  .main-hamburger {
    display: none;
    width: 32px; height: 32px;
    flex-shrink: 0;
    background: transparent; cursor: pointer;
    border: none;
    padding: 0;
    color: rgba(10, 14, 26, .65);
    margin-right: 12px;
    position: relative;
    transition: color .18s ease;
  }
  .main-hamburger:hover {
    color: #0a0e1a;
  }
  .main-hamburger svg {
    position: absolute; inset: 0; margin: auto;
    width: 18px; height: 18px;
    stroke-width: 2.2;
    transition: opacity .25s ease, transform .28s cubic-bezier(.2, .85, .2, 1);
  }
  .main-hamburger .burger-x { opacity: 0; transform: rotate(-90deg); }
  body.main-nav-open .main-hamburger .burger-lines { opacity: 0; transform: rotate(90deg); }
  body.main-nav-open .main-hamburger .burger-x      { opacity: 1; transform: rotate(0); }

  .main-nav-panel {
    display: none;
    position: fixed;
    top: var(--main-h); left: 0; right: 0;
    z-index: 101;    /* above page-bar (99) and main-bar (100), below drawer-backdrop (108) */
    background: rgba(255, 255, 255, .98);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid rgba(10, 14, 26, .08);
    box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
    opacity: 0; pointer-events: none;
    transform: translateY(-8px);
    transition: opacity .22s ease, transform .26s cubic-bezier(.2, .85, .2, 1);
    padding: 8px 0;
  }
  body.main-nav-open .main-nav-panel {
    opacity: 1; pointer-events: auto;
    transform: translateY(0);
  }
  .main-nav-panel a {
    display: block;
    padding: 14px 20px;
    color: rgba(10, 14, 26, .65);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase;
    text-decoration: none;
    transition: color .18s ease, background .18s ease;
  }
  .main-nav-panel a:hover, .main-nav-panel a:active {
    color: #0284c7;
    background: rgba(10, 14, 26, .04);
  }
  .main-nav-panel a.active { color: #0284c7; }

  /* Logo next to 'Vizi-verses' nav link */
  .main-nav a.has-vlogo,
  .main-nav-panel a.has-vlogo {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .main-nav a.has-vlogo {
    /* Tighter padding-left so the icon doesn't push the text off-balance */
    padding-left: 10px;
  }
  .vlogo-icon {
    width: 16px;
    height: 16px;
    display: block;
    flex-shrink: 0;
  }
  .main-nav-panel a.has-vlogo .vlogo-icon { width: 18px; height: 18px; }


  @media (max-width: 720px) {
    .main-hamburger { display: flex; align-items: center; justify-content: center; }
    .main-nav-panel { display: block; }
  }

  /* ─── PAGE BAR (Option B v2 — two-row layout, vizi-verse tinted) ─ */
  .page-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--page-h);
    z-index: 99;
    /* Positioned via transform so it animates on the same GPU path as .main-bar */
    transform: translateY(var(--main-h));
    will-change: transform;
    /* Faint vizi-verse purple wash over dark base */
    background:
      linear-gradient(rgba(183,148,212,.06), rgba(183,148,212,.06)),
      rgba(10, 14, 26, .9);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    padding: 0;
    transition: transform .32s cubic-bezier(.4, 0, .2, 1);
  }

  /* BOTTOM ROW — title row, now restructured */
  .title-row {
    flex: 1;
    display: flex; align-items: center;
    padding: 0 16px;
    gap: 12px;
    position: relative;
  }

  .page-hamburger {
    width: 36px; height: 36px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); background: transparent; cursor: pointer;
    border: 1px solid var(--hairline); border-radius: 5px;
    transition: color .18s ease, background .18s ease, border-color .18s ease;
  }
  .page-hamburger:hover {
    color: var(--verse);
    background: color-mix(in srgb, var(--verse) 8%, transparent);
    border-color: rgba(183,148,212,.4);
  }
  .page-hamburger svg { width: 14px; height: 14px; }

  /* AOL logo + wordmark sits naturally next to the hamburger (via .title-row flex gap) */
  .page-title-center {
    display: flex; align-items: center; gap: 10px;
  }
  /* Mini-header behavior on mobile: at top of page, just plain "AOL".
     Once scrolled past .banner-master, logo fades in and L becomes colored em. */
  .page-subject-logo {
    width: 0; height: 22px;
    flex-shrink: 0;
    border-radius: 2px;
    display: block;
    opacity: 0;
    overflow: hidden;
    transition: width .28s cubic-bezier(.2,.85,.2,1), opacity .22s ease, margin-right .28s cubic-bezier(.2,.85,.2,1);
  }
  body.past-hero .page-subject-logo {
    width: 22px;
    opacity: 1;
  }
  .page-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 17px; font-weight: 500;
    letter-spacing: -.01em;
    color: var(--text);
    white-space: nowrap;
  }
  /* Default: L is plain (matches the rest of the wordmark). */
  .page-title em {
    font-style: normal;
    color: inherit;
    transition: color .22s ease, font-style .22s ease;
  }
  /* Past-hero: L picks up the page color and goes italic, matching the main hero header */
  body.past-hero .page-title em {
    font-style: italic;
    color: var(--col2);
  }

  /* Right-side actions: save + share grouped together */
  .page-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }


  /* ═══════════════════════════════════════════════════════════════════
     LEFT RAIL — web-only chrome (>720px). Replaces the page bar on web.
     Hidden by default (mobile); shown via min-width media query below.
     ═══════════════════════════════════════════════════════════════════ */
  .page-toc {
    position: fixed; left: 0; top: var(--main-h); bottom: 0; z-index: 102;
    width: 240px;
    background: rgba(10, 14, 26, .55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-right: 1px solid rgba(255,255,255,.06);
    transition: width .38s cubic-bezier(.2,.85,.2,1);
    overflow: hidden;
    display: none;
  }

  /* Chevron / X toggle in top-right of the rail */
  .toc-close {
    position: absolute; top: 12px; right: 12px;
    width: 30px; height: 30px;
    padding: 0;
    background: transparent; cursor: pointer;
    color: rgba(255,255,255,.5);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 4px;
    transition: all .18s ease;
    z-index: 50;
  }
  .toc-close:hover {
    color: var(--col2);
    border-color: var(--col2);
    background: color-mix(in srgb, var(--col2) 8%, transparent);
  }
  .toc-close svg {
    width: 14px; height: 14px;
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
  }
  /* Three SVGs share the toc-close button: X (mobile dismiss),
     chevron-left (desktop collapse), chevron-right (desktop expand).
     Hide all by default; media queries below pick the right one. */
  .toc-close .toc-close-x,
  .toc-close .toc-close-collapse,
  .toc-close .toc-close-expand { display: none; }

  /* Mobile: always show X (drawer dismiss) */
  @media (max-width: 720px) {
    .toc-close .toc-close-x { display: block; }
  }

  /* Desktop expanded: show chevron-left (collapse) */
  @media (min-width: 721px) {
    body:not(.toc-collapsed) .toc-close .toc-close-collapse { display: block; }
    }

  /* "Show Contents" tooltip — only visible when collapsed + hovered */
  .toc-close::before {
    content: 'Show Contents';
    position: absolute; left: 40px; top: 50%; transform: translateY(-50%);
    background: rgba(10,14,26,.95);
    backdrop-filter: blur(6px);
    color: rgba(255,255,255,.85);
    padding: 6px 10px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; font-weight: 700;
    letter-spacing: .15em; text-transform: uppercase;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  body:not(.toc-collapsed) .toc-close::before { display: none; }
  body.toc-collapsed .toc-close:hover::before { opacity: 1; }

  /* "Back" tooltip — only visible when collapsed + hovered */
  .toc-back-btn::before {
    content: 'Back';
    position: absolute; left: 40px; top: 50%; transform: translateY(-50%);
    background: rgba(10,14,26,.95);
    backdrop-filter: blur(6px);
    color: rgba(255,255,255,.85);
    padding: 6px 10px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; font-weight: 700;
    letter-spacing: .15em; text-transform: uppercase;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  body:not(.toc-collapsed) .toc-back-btn::before { display: none; }
  body.toc-collapsed .toc-back-btn:hover::before { opacity: 1; }


  /* Save button — to the left of toc-close in expanded view,
     stacked between chevron and back in collapsed view */
  .toc-save {
    position: absolute; top: 12px; right: 50px;
    width: 30px; height: 30px;
    padding: 0;
    background: transparent; cursor: pointer;
    color: rgba(255,255,255,.5);
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 4px;
    transition: all .18s ease;
    z-index: 50;
  }
  .toc-save:hover {
    color: var(--col2);
    border-color: var(--col2);
    background: color-mix(in srgb, var(--col2) 8%, transparent);
  }
  .toc-save.saved {
    color: var(--verse);
    border-color: var(--verse);
    background: color-mix(in srgb, var(--verse) 12%, transparent);
  }
  .toc-save svg {
    width: 14px; height: 14px;
  }

  /* "Save" tooltip — only visible when collapsed + hovered */
  .toc-save::before {
    content: 'Save';
    position: absolute; left: 40px; top: 50%; transform: translateY(-50%);
    background: rgba(10,14,26,.95);
    backdrop-filter: blur(6px);
    color: rgba(255,255,255,.85);
    padding: 6px 10px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px; font-weight: 700;
    letter-spacing: .15em; text-transform: uppercase;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
  }
  body:not(.toc-collapsed) .toc-save::before { display: none; }
  body.toc-collapsed .toc-save:hover::before { opacity: 1; }

  /* Collapsed: save stacks between chevron (top:12) and back (top:82) */
  body.toc-collapsed .toc-save {
    left: 50%; right: auto; transform: translateX(-50%);
    top: 50px;
    width: 24px; height: 24px;
    border-radius: 4px;
  }

  /* Back to Hub button — sits below the toggle */
  .toc-back-btn {
    position: absolute; top: 48px; left: 12px; right: 12px;
    height: 52px; padding: 0 14px;
    background: transparent; cursor: pointer;
    color: rgba(255,255,255,.6);
    display: flex; align-items: center; gap: 12px;
    justify-content: flex-start;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    transition: all .18s ease;
    z-index: 49;
  }
  .toc-back-btn:hover {
    color: var(--verse);
    border-color: var(--verse);
    background: color-mix(in srgb, var(--verse) 8%, transparent);
  }
  .toc-back-btn svg {
    width: 14px; height: 14px;
    fill: none; stroke: currentColor; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
    flex-shrink: 0;
    transition: transform .18s ease;
  }
  .toc-back-btn:hover svg { transform: translateX(-2px); }

  /* TOC content below the toggle + back button */
  .toc-inner {
    position: absolute;
    top: 144px;       /* clear of toc-close + back-btn + 44px breathing room — visually grouped with contents below */
    left: 0; right: 0; bottom: 0;
    padding: 0 24px 24px;
    overflow-y: auto;
    overflow-x: hidden;
    min-width: 240px;  /* keep content at full layout width even when rail collapses */
    transition: opacity .2s ease;
  }
  .toc-page-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .toc-page-icon {
    width: 30px; height: 30px; flex: 0 0 30px;
    border-radius: 3px; overflow: hidden;
    box-shadow: 2px 2px 0 var(--col);
  }
  .toc-page-icon svg { width: 100%; height: 100%; display: block; }
  .toc-page-title {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: 22px;
    line-height: 1;
    letter-spacing: -0.02em;
    color: rgba(255,255,255,.92);
  }
  .toc-page-title em { font-style: italic; color: var(--col2); }
  .toc-page-name {
    font-family: 'Fraunces', serif; font-size: 17px; font-weight: 400;
    font-style: italic; color: rgba(255,255,255,.85); margin: 0 0 10px;
  }
  .toc-spine-track {
    position: relative;
    border-top: 1px solid rgba(255,255,255,.06);
    padding-top: 12px;
  }
  .toc-group-header {
    font-family: 'JetBrains Mono', monospace; font-size: 8.5px;
    font-weight: 700; letter-spacing: .28em; text-transform: uppercase;
    color: rgba(255,255,255,.3); padding: 14px 0 8px;
  }
  .toc-stop {
    position: relative; padding: 6px 0 6px 12px;
    cursor: pointer;
    font-family: 'Fraunces', serif; font-size: 13.5px;
    color: rgba(255,255,255,.6);
    transition: color .18s, border-color .18s;
    border-left: 1.5px solid rgba(255,255,255,.06);
  }
  .toc-stop:hover { color: rgba(255,255,255,.95); border-left-color: var(--col2); }
  .toc-stop.active { color: rgba(255,255,255,.98); border-left-color: var(--col2); }

  /* Collapsed state */
  body.toc-collapsed .page-toc { width: 36px; overflow: visible; }
  body.toc-collapsed .toc-close .toc-close-expand { display: block; }
  body.toc-collapsed .toc-close {
    left: 50%; right: auto; transform: translateX(-50%);
    top: 12px;
  }
  body.toc-collapsed .toc-back-btn {
    left: 50%; right: auto; transform: translateX(-50%);
    top: 82px;
    padding: 0; width: 24px; height: 24px;
    justify-content: center; gap: 0;
    border-radius: 4px;
  }
  body.toc-collapsed .toc-back-btn .toc-back-label { display: none; }
  body.toc-collapsed .toc-inner { opacity: 0; pointer-events: none; }

  /* ─── WEB (>720px) — show rail, hide page bar ─────────────────── */
  @media (min-width: 721px) {
    /* Bigger main bar on web — gives the brand room to breathe */
    :root { --main-h: 72px; }
    .main-brand { font-size: 26px; gap: 6px; }
    .main-brand .diamond { width: 24px; height: 24px; }
    .page-toc { display: block; }
    .page-bar { display: none; }
    body {
      padding-top: var(--main-h);
      padding-left: 240px;
    }
    body.toc-collapsed { padding-left: 36px; }
    article { max-width: none; }
  }

  @media (max-width: 720px) {
    /* Mobile: hide the breadcrumb row entirely; shrink page bar to just the title row */
    :root { --page-h: 52px; }
    .main-nav { display: none; }
  }

  /* ─── Scroll behavior (Pattern B) — MOBILE ONLY ───────────────── */
  /* JS toggles body.nav-scrolled on every viewport, but the visual
     effects only apply on mobile. On web both bars stay put. */
  @media (max-width: 720px) {
    body.nav-scrolled .main-bar { transform: translateY(-100%); }
    body.nav-scrolled .page-bar { transform: translateY(0); }
  }/* ─── Faux page content (identical to other options) ──────────── */
  article { max-width: 920px; margin: 48px auto 200px; padding: 0 24px; }
  .facet-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px; font-weight: 700;
    letter-spacing: .3em; text-transform: uppercase;
    color: var(--verse);
    margin-bottom: 18px;
    display: flex; align-items: center; gap: 12px;
  }
  .facet-eyebrow::before {
    content: ''; width: 28px; height: 1px;
    background: var(--verse); opacity: .55;
  }
  h1.facet-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(48px, 9vw, 96px);
    font-weight: 400; line-height: .95;
    letter-spacing: -.04em; margin-bottom: 14px;
  }
  h1.facet-title em { font-style: italic; font-weight: 300; color: var(--verse); }
  .facet-deck {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(18px, 2.2vw, 22px);
    font-style: italic; font-weight: 300;
    color: var(--dim); max-width: 740px; margin-bottom: 40px;
  }
  .stats-strip {
    display: flex; gap: 32px; flex-wrap: wrap;
    padding: 28px 0; margin-bottom: 56px;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);

  .stat { flex: 1; min-width: 110px; }
  .stat-value {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 26px; font-weight: 500; line-height: 1;
    color: var(--text); display: block; margin-bottom: 8px;
    letter-spacing: -.015em;
  }
  .stat-value.gold { color: var(--aol-gold); }
  .stat-value.purple { color: var(--verse); }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 700;
    letter-spacing: .2em; text-transform: uppercase;
    color: var(--faint); line-height: 1.5; display: block;
  }
  section.content-section { margin-bottom: 72px; }
  section.content-section h2 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 700;
    letter-spacing: .28em; text-transform: uppercase;
    color: var(--verse); margin-bottom: 14px;
  }
  section.content-section h3 {
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(28px, 3.5vw, 38px);
    font-weight: 400; line-height: 1.1;
    letter-spacing: -.02em; margin-bottom: 24px;
  }
  section.content-section h3 em { font-style: italic; color: var(--vizi); }
  section.content-section p {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 17px; font-weight: 300; line-height: 1.7;
    color: var(--dim); margin-bottom: 20px; max-width: 720px;
  }
  section.content-section p strong { font-weight: 500; color: var(--text); font-style: normal; }
  section.content-section p em { font-style: italic; color: var(--vizi); }

  
  /* Placeholder TOC stops — present visually but not wired to a section in this mockup */
  .toc-stop.is-placeholder { opacity: .35; cursor: not-allowed; }
  .toc-stop.is-placeholder:hover { color: rgba(255,255,255,.6); border-left-color: rgba(255,255,255,.06); }
  /* Make the article's section anchors clear the chrome when scrolled to */
  #aol-numbers, #aol-legacy, #aol-arc { scroll-margin-top: calc(var(--main-h) + 16px); }

  
  /* ═══════════════════════════════════════════════════════════════════
     MOBILE DRAWER — when hamburger is tapped, the rail slides in
     ═══════════════════════════════════════════════════════════════════ */

  /* Stack the two hamburger SVGs at the same position so they can crossfade */
  .page-hamburger { position: relative; }
  .page-hamburger svg {
    position: absolute; inset: 0; margin: auto;
    width: 14px; height: 14px;
    transition: opacity .25s ease, transform .28s cubic-bezier(.2,.85,.2,1);
  }
  .page-hamburger .burger-x { opacity: 0; transform: rotate(-90deg); }
  body.drawer-open .page-hamburger .burger-lines { opacity: 0; transform: rotate(90deg); }
  body.drawer-open .page-hamburger .burger-x      { opacity: 1; transform: rotate(0); }

  /* Backdrop — hidden by default, fades in when drawer is open */
  .drawer-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, .55);
    z-index: 108;
    opacity: 0; pointer-events: none;
    transition: opacity .32s cubic-bezier(.2,.85,.2,1);
  }
  body.drawer-open .drawer-backdrop { opacity: 1; pointer-events: auto; }

  /* Mobile-only: rail becomes a slide-in drawer */
  @media (max-width: 720px) {
    .page-toc {
      display: block;
      top: 0;            /* covers the main bar when open */
      width: 280px;
      max-width: 86vw;
      z-index: 110;      /* above main bar */
      transform: translateX(-100%);
      transition: transform .36s cubic-bezier(.2,.85,.2,1);
      pointer-events: none;
      box-shadow: 4px 0 24px rgba(0, 0, 0, .35);
    }
    body.drawer-open .page-toc {
      transform: translateX(0);
      pointer-events: auto;
    }
    .drawer-backdrop { z-index: 109; }
  }

  /* ★★★ MASTER CONTAINER: COMPANY BANNER ★★★                             */
  /* ====================================================================== */
  

  .banner-master {
    width: 100%;
    margin: 0;
    position: relative;
    background: linear-gradient(
      180deg,
      color-mix(in srgb, var(--col) 35%, #0a0e1a) 0%,
      color-mix(in srgb, var(--col) 22%, #0a0e1a) 60%,
      color-mix(in srgb, var(--col2, var(--col)) 16%, color-mix(in srgb, var(--col) 8%, #0a0e1a)) 100%
    );
  }

.banner-content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 44px 24px 32px;
  }

.banner-title-row {
    /* Flex-wrap so the secondary icons drop to a new line when there isn't
       enough horizontal room — no more title↔icons overlap at mid widths. */
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px 32px;  /* row-gap · column-gap */
    margin-bottom: 14px;
  }

.banner-title-row .detail-name {
    margin-bottom: 0;
    min-width: 0;
    overflow: visible;
    white-space: normal;
  }

/* Wraps logo + title; title group occupies the first (growable) column.
     min-width:0 lets it shrink below its content size if needed. */
  .banner-title-group {
    display: flex;
    align-items: center;
    gap: 18px;
    min-width: 0;
    overflow: visible;
    /* Takes available width but allows secondary icons to wrap below when tight */
    flex: 1 1 auto;
  }

/* Secondary icons in the right column — auto-sized, never grows
     into the title's space regardless of how long the title is. */
  .banner-icons-secondary {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    /* No flex-shrink: when the row can't fit, it wraps under the title group
       (not squeezed into a strip). */
    flex: 0 1 auto;
  }

.banner-icon {
    width: 60px;
    height: 60px;
    background: white;
    border: 2.5px solid #0a0a0a;
    border-radius: 4px;
    overflow: visible;
    position: relative;
    cursor: default;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 3px 3px 0 var(--col);
    flex-shrink: 0;
  }

.banner-icon-primary {
    width: 72px;
    height: 72px;
    box-shadow: 4px 4px 0 var(--col);
  }

/* Founded-location icon (state outline) removed — was right-aligned in banner top row */
  .banner-icon > svg {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 1px;
  }

.banner-icon:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 var(--col);
  }

.banner-icon-primary:hover {
    box-shadow: 6px 6px 0 var(--col);
  }

.banner-icon::after {
    content: attr(data-label);
    position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    background: #0a0a0a;
    color: #fff;
    padding: 5px 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s;
    z-index: 50;
    border: 1.5px solid var(--col);
  }

.banner-icon:hover::after { opacity: 1; }

/* Colored full-width strip at bottom of banner-master.
     14px tall. Solid --col with diagonal stripe texture and white top accent. */
  .banner-bar {
    height: 14px;
    background: var(--col);
    position: relative;
    margin: 0;
    overflow: hidden;
  }

.scroller {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 32px 24px 28px;
    margin-top: 12px;
    position: relative;
  }

.scroller::-webkit-scrollbar { height: 6px; }

.scroller::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); }

.scroller::-webkit-scrollbar-thumb { background: var(--col); border-radius: 3px; }

.scroller-hint {
    position: absolute;
    top: 6px;
    right: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }

.station-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-top: 3px solid var(--col);
    border-radius: 4px;
    padding: 16px 14px;
    margin-bottom: 30px;
    transition: all 0.2s;
    text-align: left;
  }

.station-card:hover { background: rgba(255,255,255,0.08); transform: translateY(-3px); }

.station-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--col);
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
  }

.station-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.15;
    margin-bottom: 6px;
    color: white;
    letter-spacing: -0.01em;
  }

.station-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.65);
    line-height: 1.45;
    font-family: 'Fraunces', serif;
    font-weight: 300;
  }

.station-desc em { color: white; font-style: italic; }

.acq-carousel-scroll,
  .prod-carousel-scroll,
  .scroller,
  .ranking-chart { cursor: grab; }

.acq-carousel-scroll.is-dragging,
  .prod-carousel-scroll.is-dragging,
  .scroller.is-dragging,
  .ranking-chart.is-dragging { cursor: grabbing !important; user-select: none; }

/* ★★★ MASTER — BY THE NUMBERS ★★★                                        */
  /* ====================================================================== */
  .nums-section { max-width: 1100px; margin: 0 auto; padding: 44px 24px 0; }

.nums-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--col); font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }

.nums-eyebrow::before { content: ''; width: 24px; height: 1px; background: var(--col); }

.nums-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }

.num-box { background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); border-top: 3px solid var(--col); border-radius: 4px; padding: 18px 14px 14px; }

.num-val { font-family: 'Fraunces', serif; font-size: clamp(26px, 3.5vw, 38px); font-weight: 400; color: var(--col2, var(--col)); line-height: 1; letter-spacing: -0.03em; }

.num-label { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255,255,255,.38); margin-top: 9px; line-height: 1.5; }

/* ====================================================================== */
  /* ★★★ MASTER — LEGACY & FIRSTS ★★★                                       */
  /* ====================================================================== */
  .legacy-section { max-width: 1100px; margin: 0 auto; padding: 40px 24px 0; }

.legacy-eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--col); font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }

.legacy-eyebrow::before { content: ''; width: 24px; height: 1px; background: var(--col); }

.legacy-list { list-style: none; border-top: 1px solid rgba(255,255,255,.08); }

.legacy-item { padding: 16px 0 16px 22px; border-left: 3px solid var(--col); border-bottom: 1px solid rgba(255,255,255,.06); font-family: 'Fraunces', serif; font-size: 15px; font-weight: 300; color: rgba(255,255,255,.7); line-height: 1.55; }

.legacy-item:last-child { border-bottom: none; }

.legacy-item strong { color: #fff; font-weight: 600; font-style: italic; display: block; font-size: 13px; letter-spacing: 0.01em; margin-bottom: 3px; }

/* ── DATE BADGE ON ACQ / PROD CARDS (matches station-date style) ── */
  .acq-card-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8.5px;

/* ─────────────────────────────────────────────────────────────────────
   § 09  MOCKUP: CIS TERMINAL (CompuServe 1985)

  /* ═══ §09  CIS TERMINAL MOCKUP — 1985 ════════════════════════════════ */
  
  /* ═══════════════════════════════════════════════════════════════════
   § 6  INTERACTIVE MOCKUPS (CIS Terminal, Electronic Mall, WinCIM)
        Each mockup is self-contained — styles scoped with #view-* prefix
   ═══════════════════════════════════════════════════════════════════ */
  /* ═══════════════════════════════════════════════════════════

         Green phosphor terminal — all .cis-* classes
   ═══════════════════════════════════════════════════════════ */
#view-cis-1985 {
    background: #080d08;
    min-height: 100vh;

  }

.station-event-top {
    width: 228px;               /* card width */
    margin: 0 auto;             /* center within 288px grid content area → aligns with bar */
    height: 360px;              /* tall enough for longest cards */
    box-sizing: border-box;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 0;
    position: relative;
    overflow: visible;
  }

/* Vertical connector from card bottom to spine dot */
  /* no top-to-spine connector — cards top-aligned, spine dot connects below */

  .station-event-spine {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    z-index: 2;
  }

.station-dot {

/* station-card: natural height so align-items:flex-end places it flush at bottom */

    box-sizing: border-box;
    display: flex;
    flex-direction: column;

/* Vertical bar from dot center upward through event-top to meet card bottom */
    .station-event-spine::before {

    left: 50%;

    height: var(--bar-h, 360px);
    background: var(--col);

  .station-card {

  /* ───────────────────────────────────────────────────────────────────
     PAGE-LEVEL CHROME GATING
     ────────────────────────────────────────────────────────────────────
     body.no-facet-chrome is applied by populateChrome(viewId) whenever
     the active view has no entry in FACET_NAV (i.e. view-main, view-
     insights, view-dictionary, view-browsers, and the small detail views
     like view-mosaic/yahoo/lycos/etc.). On those views, only the main
     bar should appear — no page-bar, no side rail, and the body padding

     ─────────────────────────────────────────────────────────────────── */
  body.no-facet-chrome .page-bar { display: none !important; }

  <!-- ════════════════════════════════════════════════════════════════════
       NAV CHROME · JS  — scroll behavior, hamburger, scroll-spy, fragment
       handler. Same on every page (no-ops gracefully if a page has no views).
       ════════════════════════════════════════════════════════════════════ -->
  <script>
  {% raw %}
(function() {
  // ════════════════════════════════════════════════════════════════════
  // FACET_NAV — per-facet TOC data.
  // To add/remove sections: edit the entry for that view ID.
  // Section IDs MUST match real <section id="..."> elements in the view,
  // otherwise the TOC stop click will silently no-op.
  // ════════════════════════════════════════════════════════════════════
  const FACET_NAV = {
    'view-aol': {
      toc: [
        { group: 'Story', stops: [{ label: 'By the Numbers', target: 'aol-numbers' }, { label: 'Legacy & Firsts', target: 'aol-legacy' }] },
        { group: 'Business', stops: [{ label: 'Acquisitions', target: 'aol-acquisitions' }, { label: 'Products', target: 'aol-products' }] },
        { group: 'Economics', stops: [{ label: 'Ranking Chart', target: 'aol-ranking' }, { label: 'Financial History', target: 'aol-financial' }, { label: 'Follow the Money', target: 'aol-ftm' }, { label: 'Where the Money Went', target: 'aol-moneywent' }] },
        { group: 'Time Capsules', stops: [{ label: 'Mockups', target: 'aol-mockups' }] },
      ],
    },
    'view-compuserve': {
      toc: [
        { group: 'Story', stops: [{ label: 'By the Numbers', target: 'cs-numbers' }, { label: 'Legacy & Firsts', target: 'cs-legacy' }] },
        { group: 'Business', stops: [{ label: 'Acquisitions', target: 'cs-acquisitions' }, { label: 'Products', target: 'cs-products' }] },
        { group: 'Economics', stops: [{ label: 'Ranking Chart', target: 'cs-ranking' }, { label: 'Financial History', target: 'cs-financial' }, { label: 'Follow the Money', target: 'cs-ftm' }, { label: 'Where the Money Went', target: 'cs-moneywent' }] },
        { group: 'Infrastructure', stops: [{ label: 'Infrastructure', target: 'cs-infrastructure' }] },
        { group: 'Time Capsules', stops: [{ label: 'Mockups', target: 'cs-mockups' }] },
      ],
    },
    'view-prodigy': {
      toc: [
        { group: 'Story', stops: [{ label: 'By the Numbers', target: 'prod-numbers' }, { label: 'Legacy & Firsts', target: 'prod-legacy' }] },
        { group: 'Business', stops: [{ label: 'Acquisitions', target: 'prod-acquisitions' }, { label: 'Products', target: 'prod-products' }] },
        { group: 'Economics', stops: [{ label: 'Ranking Chart', target: 'prod-ranking' }, { label: 'Financial History', target: 'prod-financial' }, { label: 'Follow the Money', target: 'prod-ftm' }, { label: 'Where the Money Went', target: 'prod-moneywent' }] },
      ],
    },
    'view-genie': {
      toc: [
        { group: 'Story', stops: [{ label: 'By the Numbers', target: 'gen-numbers' }, { label: 'Legacy & Firsts', target: 'gen-legacy' }] },
        { group: 'Business', stops: [{ label: 'Acquisitions', target: 'gen-acquisitions' }, { label: 'Products', target: 'gen-products' }] },
        { group: 'Economics', stops: [{ label: 'Ranking Chart', target: 'gen-ranking' }, { label: 'Financial History', target: 'gen-financial' }, { label: 'Follow the Money', target: 'gen-ftm' }, { label: 'Where the Money Went', target: 'gen-moneywent' }] },
        { group: 'Infrastructure', stops: [{ label: 'Infrastructure', target: 'gen-infrastructure' }] },
        { group: 'Time Capsules', stops: [{ label: 'Mockups', target: 'gen-mockups' }] },
      ],
    },
    'view-delphi': {
      toc: [
        { group: 'Story', stops: [{ label: 'By the Numbers', target: 'del-numbers' }, { label: 'Legacy & Firsts', target: 'del-legacy' }] },
        { group: 'Business', stops: [{ label: 'Acquisitions', target: 'del-acquisitions' }, { label: 'Products', target: 'del-products' }] },
        { group: 'Economics', stops: [{ label: 'Ranking Chart', target: 'del-ranking' }, { label: 'Follow the Money', target: 'del-ftm' }, { label: 'Where the Money Went', target: 'del-moneywent' }] },
        { group: 'Time Capsules', stops: [{ label: 'Mockups', target: 'del-mockups' }] },
      ],
    },
  };

  // ════════════════════════════════════════════════════════════════════
  // populateChrome(viewId) — called whenever the active view changes.
  // Reads the view's own DOM for color tokens (--col, --col2), title
  // (.detail-name), and logo (.banner-icon-primary SVG), then renders the
  // page-bar and page-toc rail accordingly.
  // For non-facet views (no FACET_NAV entry), the page-bar and rail hide
  // via body.no-facet-chrome.
  // ════════════════════════════════════════════════════════════════════
  function populateChrome(viewId) {
    const cfg = FACET_NAV[viewId];
    const body = document.body;

    if (!cfg) {
      // No chrome data for this view (view-main, view-insights, etc.)
      body.classList.add('no-facet-chrome');
      body.classList.remove('past-hero');
      body.style.removeProperty('--col');
      body.style.removeProperty('--col2');
      return;
    }
    body.classList.remove('no-facet-chrome');

    const view = document.getElementById(viewId);
    if (!view) return;

    // 1. Color tokens — copy from the view's inline style to body so all
    //    chrome elements (which live outside the view) can inherit them.
    const viewStyle = view.style;
    if (viewStyle.getPropertyValue('--col')) {
      body.style.setProperty('--col', viewStyle.getPropertyValue('--col'));
    }
    if (viewStyle.getPropertyValue('--col2')) {
      body.style.setProperty('--col2', viewStyle.getPropertyValue('--col2'));
    }

    // 2. Page title — clone the .detail-name HTML (the big "AO<em>L</em>"
    //    title in the banner). Used by page-bar AND toc-page-name.
    const titleEl = view.querySelector('.detail-name');
    const titleHTML = titleEl ? titleEl.innerHTML : '';

    // 3. Logo — clone the .banner-icon-primary SVG (the colored facet icon).
    const iconEl = view.querySelector('.banner-icon-primary svg');
    const iconHTML = iconEl ? iconEl.outerHTML : '';

    // 4. Inject into page-bar hosts
    const pageTitleHost = document.getElementById('page-title-host');
    const pageLogoHost  = document.getElementById('page-subject-logo');
    if (pageTitleHost) pageTitleHost.innerHTML = titleHTML;
    if (pageLogoHost)  pageLogoHost.innerHTML  = iconHTML;

    // 5. Build the rail's inner content from FACET_NAV.toc
    const tocHost = document.getElementById('toc-inner-host');
    if (tocHost) {
      const stopsHTML = cfg.toc.map(group => {
        const stopRows = group.stops.map(s =>
          `<div class="toc-stop" data-target="${s.target}">${s.label}</div>`
        ).join('');
        return `<div class="toc-group-header">${group.group}</div>${stopRows}`;
      }).join('');
      tocHost.innerHTML = `
        <div class="toc-page-header">
          <div class="toc-page-icon">${iconHTML}</div>
          <div class="toc-page-title">${titleHTML}</div>
        </div>
        <div class="toc-page-name">Contents:</div>
        <div class="toc-spine-track">
          ${stopsHTML}
        </div>`;
    }

    // 6. Reset scroll-dependent state
    body.classList.remove('past-hero');
    body.classList.remove('drawer-open');
    body.classList.remove('main-nav-open');

    // 7. Re-bind TOC stop clicks (since we just regenerated them)
    bindTocStops();

    // 8. Re-bind scroll-spy IntersectionObserver to the new view's section IDs.
    //    Each facet has different section IDs (aol-*, cs-*, prod-*, etc.) so
    //    the observer must be torn down + rebuilt per view.
    bindScrollSpy();

    // 9. Re-wire the mini-header observer to this view's .detail-name
    rewireTitleObserver(titleEl);
  }

  // ════════════════════════════════════════════════════════════════════
  // bindTocStops() — attach scroll-to-target handlers. Called by
  // populateChrome whenever the rail is regenerated.
  // Also sets _scrollingLock briefly so the scroll-spy doesn't flicker
  // through intermediate sections during the programmatic smooth scroll.
  // ════════════════════════════════════════════════════════════════════
  let _scrollingLock = false;
  function bindTocStops() {
    document.querySelectorAll('.toc-stop').forEach(stop => {
      stop.addEventListener('click', () => {
        if (stop.classList.contains('is-placeholder')) return;
        document.querySelectorAll('.toc-stop').forEach(s => s.classList.remove('active'));
        stop.classList.add('active');
        const targetId = stop.dataset.target;
        if (!targetId) return;
        const target = document.getElementById(targetId);
        if (!target) return;
        // Programmatic scroll — hold scroll-spy quiet through the animation
        _scrollingLock = true;
        setTimeout(() => { _scrollingLock = false; }, 700);
        const top = target.getBoundingClientRect().top + window.scrollY - 72;
        window.scrollTo({ top, behavior: 'smooth' });
        document.body.classList.remove('drawer-open');
      });
    });
  }

  // ════════════════════════════════════════════════════════════════════
  // bindScrollSpy() — IntersectionObserver that highlights the TOC stop
  // whose section is currently near the top of the viewport. Re-built
  // every time populateChrome() runs (because each facet's sections have
  // different IDs). Honors _scrollingLock so programmatic scrolls don't
  // cause flicker.
  // ════════════════════════════════════════════════════════════════════
  let _scrollSpyObserver = null;
  function bindScrollSpy() {
    // Tear down any previous observer (from the prior view)
    if (_scrollSpyObserver) {
      _scrollSpyObserver.disconnect();
      _scrollSpyObserver = null;
    }
    if (!('IntersectionObserver' in window)) return;
    // Map each TOC stop to its target section element
    const sectionToStop = new Map();
    document.querySelectorAll('.toc-stop[data-target]').forEach(stop => {
      const section = document.getElementById(stop.dataset.target);
      if (section) sectionToStop.set(section, stop);
    });
    if (sectionToStop.size === 0) return;
    _scrollSpyObserver = new IntersectionObserver((entries) => {
      if (_scrollingLock) return;
      // Of the currently-intersecting sections, the one closest to the top wins
      const inView = entries
        .filter(e => e.isIntersecting)
        .map(e => ({ id: e.target.id, top: e.boundingClientRect.top }))
        .sort((a, b) => a.top - b.top);
      if (inView.length === 0) return;
      const activeId = inView[0].id;
      document.querySelectorAll('.toc-stop').forEach(s =>
        s.classList.toggle('active', s.dataset.target === activeId)
      );
    }, {
      // Trigger zone is a thin strip near the top — just below the chrome
      rootMargin: '-72px 0px -75% 0px',
      threshold: 0
    });
    sectionToStop.forEach((_, section) => _scrollSpyObserver.observe(section));
  }

  // ════════════════════════════════════════════════════════════════════
  // rewireTitleObserver(titleEl) — sets up the IntersectionObserver that
  // toggles body.past-hero when the big page title scrolls past the page
  // bar. Called by populateChrome with the new active view's title.
  // ════════════════════════════════════════════════════════════════════
  let _titleObserver = null;
  function rewireTitleObserver(titleEl) {
    if (_titleObserver) { _titleObserver.disconnect(); _titleObserver = null; }
    if (!titleEl || !('IntersectionObserver' in window)) return;
    _titleObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        document.body.classList.toggle('past-hero', !entry.isIntersecting);
      });
    }, { rootMargin: '-160px 0px 0px 0px', threshold: 0 });
    _titleObserver.observe(titleEl);
  }

  // ════════════════════════════════════════════════════════════════════
  // Hook into existing showView() — wrap it so chrome updates whenever
  // a view becomes active. Falls back gracefully if showView isn't defined.
  // ════════════════════════════════════════════════════════════════════
  (function hookShowView() {
    if (typeof window.showView !== 'function') return;
    const originalShowView = window.showView;
    window.showView = function(id) {
      const result = originalShowView.apply(this, arguments);
      try { populateChrome(id); } catch (e) { console.warn('populateChrome failed:', e); }
      return result;
    };
  })();

  // Initial population: find which view is currently active and populate.
  (function initialPopulate() {
    const active = document.querySelector('.view.active');
    if (active && active.id) {
      populateChrome(active.id);
    } else {
      populateChrome(null);  // hides page-bar/rail
    }
  })();

  // ════════════════════════════════════════════════════════════════════
  // "Back to Hub" — the rail's #toc-back button returns to view-main
  // (the Top 10 timeline grid). Bound once at boot since the button is
  // static HTML (not regenerated like TOC stops).
  // ════════════════════════════════════════════════════════════════════
  (function bindBackToHub() {
    const backBtn = document.getElementById('toc-back');
    if (!backBtn) return;
    backBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (typeof window.showView === 'function') {
        window.showView('view-main');
      }
      // Close the mobile drawer if it was open
      document.body.classList.remove('drawer-open');
    });
  })();

let lastY = window.scrollY;
    let ticking = false;
    function update() {
      const y = window.scrollY;
      // If the global nav panel is open, pause Pattern B — keep the main bar
      // in place so the dropdown doesn't get orphaned in mid-air
      if (document.body.classList.contains('main-nav-open')) {
        lastY = y;
        ticking = false;
        return;
      }
      const goingDown = y > lastY;
      const past = y > 80;
      const nearTop = y < 20;
      if (past && goingDown) document.body.classList.add('nav-scrolled');
      else if (nearTop || !goingDown) document.body.classList.remove('nav-scrolled');
      lastY = y;
      ticking = false;
    }
    window.addEventListener('scroll', () => {
      if (!ticking) { requestAnimationFrame(update); ticking = true; }
    }, { passive: true });
    // Hamburger toggles the drawer; the morph (hamburger ↔ X) is pure CSS
    const hamburger = document.getElementById('page-hamburger');
    if (hamburger) {
      hamburger.addEventListener('click', () => {
        // Close the main nav if it was open (one menu at a time)
        document.body.classList.remove('main-nav-open');
        document.body.classList.toggle('drawer-open');
      });
    }
    // Backdrop click closes drawer
    const backdrop = document.getElementById('drawer-backdrop');
    if (backdrop) {
      backdrop.addEventListener('click', () => {
        document.body.classList.remove('drawer-open');
      });
    }
    // Esc key closes any open drawer or menu
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.body.classList.remove('drawer-open');
        document.body.classList.remove('main-nav-open');
      }
    });

    // Main-bar hamburger toggles the global nav panel (mobile only)
    const mainHamburger = document.getElementById('main-hamburger');
    if (mainHamburger) {
      mainHamburger.addEventListener('click', (e) => {
        e.stopPropagation();
        // Close the page drawer if it was open (one menu at a time)
        document.body.classList.remove('drawer-open');
        document.body.classList.toggle('main-nav-open');
      });
    }
    // Tap-outside the panel closes it
    document.addEventListener('click', (e) => {
      if (!document.body.classList.contains('main-nav-open')) return;
      if (e.target.closest('#main-nav-panel') || e.target.closest('#main-hamburger')) return;
      document.body.classList.remove('main-nav-open');
    });
    // Tapping a panel link sets active state and (for same-page anchor
    // links only) closes the panel. We deliberately DON'T close the panel
    // for real page navigations (href="index.html" / "browse.html") because
    // Safari iOS cancels the link's default navigation when its ancestor
    // is set to pointer-events:none mid-click — which is exactly what
    // closing the panel does. Real navigations reset state on the next
    // page load anyway, so leaving the panel open here is harmless.
    document.querySelectorAll('#main-nav-panel a').forEach(a => {
      a.addEventListener('click', () => {
        document.querySelectorAll('#main-nav-panel a').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        const href = a.getAttribute('href') || '';
        if (href === '' || href.startsWith('#')) {
          document.body.classList.remove('main-nav-open');
        }
      });
    });
    // Save button toggle (visual demo only)
    document.querySelector('.page-save').addEventListener('click', e => {
      const btn = e.currentTarget;
      btn.classList.toggle('saved');
      btn.style.color = btn.classList.contains('saved') ? 'var(--verse)' : '';
    });

    // Left-rail toggle (web)
    const tocClose = document.getElementById('toc-close');
    if (tocClose) {
      tocClose.addEventListener('click', () => {
        // On mobile, X closes the drawer; on web, X collapses the rail
        if (window.matchMedia('(max-width: 720px)').matches) {
          document.body.classList.remove('drawer-open');
        } else {
          document.body.classList.toggle('toc-collapsed');
        }
      });
    }
    // Save button (web rail, demo only — toggles saved state)
    const tocSave = document.getElementById('toc-save');
    if (tocSave) {
      tocSave.addEventListener('click', () => {
        tocSave.classList.toggle('saved');
      });
    }
    // Back to Hub (demo only — just flashes)
    const tocBack = document.getElementById('toc-back');
    if (tocBack) {
      tocBack.addEventListener('click', () => {
        tocBack.style.background = 'color-mix(in srgb, var(--verse) 18%, transparent)';
        setTimeout(() => { tocBack.style.background = ''; }, 240);
      });
    }
    // TOC stops — scroll to target section if data-target resolves
    document.querySelectorAll('.toc-stop').forEach(stop => {
      stop.addEventListener('click', () => {
        if (stop.classList.contains('is-placeholder')) return;
        document.querySelectorAll('.toc-stop').forEach(s => s.classList.remove('active'));
        stop.classList.add('active');
        const targetId = stop.dataset.target;
        if (!targetId) return;
        const target = document.getElementById(targetId);
        if (!target) return;
        // Scroll with manual offset for the chrome (~72px clearance)
        const top = target.getBoundingClientRect().top + window.scrollY - 72;
        window.scrollTo({ top, behavior: 'smooth' });
        // Close drawer if it was open (mobile)
        document.body.classList.remove('drawer-open');
      });
    });

    // ──────────────────────────────────────────────────────────────────
    // MINI-HEADER: when the big page title (.detail-name "AO L") scrolls
    // past the bottom of the page-bar, page-bar gains the logo + colored
    // wordmark. Reverts when the title scrolls back into view.
    // ──────────────────────────────────────────────────────────────────
    const heroTitle = document.querySelector('.detail-name');
    if (heroTitle && 'IntersectionObserver' in window) {
      const titleObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          // Title is "out of view" when it has scrolled past the page-bar.
          // rootMargin shrinks the viewport from the top by ~52px (page-bar height)
          // so the trigger fires the instant the title clears the bar's bottom edge.
          document.body.classList.toggle('past-hero', !entry.isIntersecting);
        });
      }, {
        rootMargin: '-160px 0px 0px 0px',
        threshold: 0
      });
      titleObserver.observe(heroTitle);
    }

    // ──────────────────────────────────────────────────────────────────
    // SCROLL-SPY for TOC stops is wired by bindScrollSpy() in the chrome
    // header, called from populateChrome() so it re-binds when the user
    // navigates between facets (different section IDs per facet).
    // The scrollingLock-on-click is handled inside bindTocStops().
    // ──────────────────────────────────────────────────────────────────

    // ──────────────────────────────────────────────────────────────────
    // SWIPE-TO-CLOSE (mobile drawer only)
    // No swipe-to-open: would conflict with Safari's edge-from-left back gesture
    // ──────────────────────────────────────────────────────────────────
    const drawer = document.querySelector('.page-toc');
    if (drawer) {
      let touchStartX = 0;
      let touchStartY = 0;
      let tracking = false;

      drawer.addEventListener('touchstart', (e) => {
        if (!document.body.classList.contains('drawer-open')) return;
        if (e.touches.length !== 1) return;
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        tracking = true;
      }, { passive: true });

      drawer.addEventListener('touchmove', (e) => {
        if (!tracking) return;
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        // If vertical movement dominates, this is a scroll — bail out
        if (Math.abs(dy) > Math.abs(dx)) {
          tracking = false;
          return;
        }
        // Leftward swipe of >50px → close drawer
        if (dx < -50) {
          document.body.classList.remove('drawer-open');
          tracking = false;
        }
      }, { passive: true });

      drawer.addEventListener('touchend', () => { tracking = false; });
    }


  // ════════════════════════════════════════════════════════════════════
  // URL fragment handling — lets other pages deep-link into a facet view.
  //   e.g., browse.html links to "index.html#aol"  →  opens view-aol on load
  // Pattern: hash "aol" → viewId "view-aol"
  // ════════════════════════════════════════════════════════════════════
  function handleHashChange() {
    const hash = window.location.hash.replace('#', '').trim();
    if (!hash) return;
    const viewId = hash.startsWith('view-') ? hash : 'view-' + hash;
    const target = document.getElementById(viewId);
    if (target && typeof window.showView === 'function') {
      window.showView(viewId);
    }
  }
  window.addEventListener('hashchange', handleHashChange);
  // Run once on load too, in case we arrived via deep link
  if (window.location.hash) {
    // Defer a tick so initialPopulate has run first
    setTimeout(handleHashChange, 0);
  }

})();
